[package]
name = "era-office-desktop"
version = "0.1.0"
edition = "2021"
description = "ERA Office desktop — Solo Docs/Tables (S3/S5) + Corporate Workspace shell (S4)"
publish = false

[lib]
name = "era_office_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "era-office-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
era-docs-core = { path = "../../../crates/era-docs-core" }
era-tables-core = { path = "../../../crates/era-tables-core" }
era-pres-core = { path = "../../../crates/era-pres-core" }
era-projects-core = { path = "../../../crates/era-projects-core" }
era-license = { path = "../../../crates/era-license" }
era-office-richtext = { path = "../../../services/platform/office-richtext" }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dirs = "6"
ed25519-dalek = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
rfd = "0.15"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
