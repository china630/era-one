<body data-page="contacts">

<header class="top" id="site-header"></header>

<section class="hero subhero">
  <div class="wrap">
    <div class="eyebrow" data-i18n="nav.contacts">اتصل بنا</div>
    <h1 data-i18n="pg.contacts.h1">اتصل بنا</h1>
    <p class="lead" data-i18n="pg.contacts.lead">تحدّث مع فريقنا حول التجارب والتراخيص والنشر داخل محيطك.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="contact-grid">
      <div class="contact-info">
        <div class="ci-row">
          <div class="ci-lbl" data-i18n="contacts.sales">المبيعات</div>
          <div class="ci-val"><a href="mailto:sales@era-one.solutions">sales@era-one.solutions</a></div>
        </div>
        <div class="ci-row">
          <div class="ci-lbl" data-i18n="contacts.site">الموقع</div>
          <div class="ci-val"><a href="https://www.era-one.solutions">www.era-one.solutions</a></div>
        </div>
        <div class="ci-row">
          <div class="ci-lbl" data-i18n="contacts.office">المكتب الرئيسي</div>
          <div class="ci-val" data-i18n="contacts.addr">جنيف، سويسرا</div>
        </div>
      </div>
      <form class="form" onsubmit="return false;">
        <div class="fld">
          <label data-i18n="form.name">اسمك</label>
          <input type="text" name="name" />
        </div>
        <div class="fld">
          <label data-i18n="form.email">بريد العمل</label>
          <input type="email" name="email" />
        </div>
        <div class="fld">
          <label data-i18n="form.org">المؤسسة</label>
          <input type="text" name="org" />
        </div>
        <div class="fld">
          <label data-i18n="form.msg">كيف يمكننا المساعدة؟</label>
          <textarea name="msg"></textarea>
        </div>
        <button class="btn-lg btn-primary" type="submit" data-i18n="form.send">إرسال الطلب</button>
        <div class="fnote" data-i18n="form.note">نموذج تجريبي لا يُرسَل. استخدم البريد أعلاه.</div>
      </form>
    </div>
  </div>
</section>
