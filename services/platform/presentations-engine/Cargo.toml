[package]
name = "era-presentations-engine"
version = "0.1.0"
edition = "2021"
description = "ERA Presentations engine — .erap, pptx/odp subset (ADR-0026)"
publish = false

[lib]
name = "era_presentations_engine"
path = "src/lib.rs"

[[bin]]
name = "era-presentations-engine"
path = "src/main.rs"

[dependencies]
era-pres-core = { path = "../../../crates/era-pres-core" }
era-office-richtext = { path = "../office-richtext" }
jsonwebtoken = "9"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[dev-dependencies]
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
