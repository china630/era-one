# ERA Office P0 — standalone pilot / Tech Eval compose
# Core: docker compose -f deploy/docker-compose.office.yml up -d --wait
# Full TE (Docs+Tables+Pres+Projects+Office AI):
#   docker compose -f deploy/docker-compose.office.yml \
#     --profile docs --profile office-engines up -d --wait --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: era
      POSTGRES_PASSWORD: era_dev_only
      POSTGRES_DB: era
    ports:
      - "5433:5432"
    volumes:
      - era_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U era"]
      interval: 5s
      timeout: 3s
      retries: 10

  office-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: era_dev_only
      ERA_OFFICE_DATABASE_URL: postgres://era:era_dev_only@postgres:5432/era?sslmode=disable
    volumes:
      - ../deploy/postgres/migrations/platform:/migrations:ro
      - ../deploy/postgres/migrations/comms:/comms-migrations:ro
      - ../scripts/office-bootstrap-tenants.sql:/scripts/office-bootstrap-tenants.sql:ro
    command: >
      sh -c "until pg_isready -h postgres -U era; do sleep 1; done;
      for f in /comms-migrations/001_initial.sql; do
        echo applying $$f; psql $$ERA_OFFICE_DATABASE_URL -v ON_ERROR_STOP=1 -f $$f;
      done;
      for f in /migrations/001_drive.sql /migrations/002_docs_sessions.sql /migrations/005_projects.sql /migrations/006_projects_collab.sql /migrations/007_projects_w2.sql /migrations/008_drive_lock.sql /migrations/009_projects_priority.sql /migrations/010_drive_trash.sql; do
        echo applying $$f; psql $$ERA_OFFICE_DATABASE_URL -v ON_ERROR_STOP=1 -f $$f;
      done;
      psql $$ERA_OFFICE_DATABASE_URL -v ON_ERROR_STOP=1 -f /scripts/office-bootstrap-tenants.sql"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: era
      MINIO_ROOT_PASSWORD: era_dev_only
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.identity-api
    environment:
      ERA_IDENTITY_HTTP_ADDR: ":8160"
      ERA_IDENTITY_ISSUER: http://identity-api:8160
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
      ERA_IDENTITY_DEV: "1"
      # Empty DSN → in-memory demo users (alice@mail.gov.az / 1234) for O-2 login.
      # Set ERA_COMMS_DATABASE_URL to use PG identity_users after migrate.
      ERA_COMMS_DATABASE_URL: ""
    ports:
      - "8160:8160"
    depends_on:
      office-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8160/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  drive-api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.drive-api
    environment:
      ERA_DRIVE_HTTP_ADDR: ":8175"
      ERA_OFFICE_DEV: "1"
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
      ERA_DRIVE_SERVICE_TOKEN: dev-drive-service-token
      ERA_WORKSPACE_BASE_URL: http://localhost:8170
      ERA_MINIO_ENDPOINT: minio:9000
      ERA_MINIO_ACCESS_KEY: era
      ERA_MINIO_SECRET_KEY: era_dev_only
      ERA_DRIVE_BUCKET: era-drive
      ERA_OFFICE_DATABASE_URL: postgres://era:era_dev_only@postgres:5432/era?sslmode=disable
    ports:
      - "8175:8175"
    depends_on:
      minio:
        condition: service_healthy
      office-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8175/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  workspace:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.workspace
    environment:
      ERA_WORKSPACE_HTTP_ADDR: ":8170"
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
      ERA_DRIVE_API_URL: http://drive-api:8175
      ERA_IDENTITY_API_URL: http://identity-api:8160
      # Proxied when docs-engine is up (--profile docs).
      ERA_DOCS_API_URL: http://docs-engine:8142
      # Proxied when tables/presentations/projects/ai are up (--profile office-engines).
      ERA_TABLES_API_URL: http://tables-engine:8143
      ERA_PRESENTATIONS_API_URL: http://presentations-engine:8144
      ERA_PROJECTS_API_URL: http://docs-projects:8145
      ERA_DOCS_AI_URL: http://docs-ai:8146
    ports:
      - "8170:8170"
    depends_on:
      drive-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      docs-engine:
        condition: service_healthy
        required: false
      tables-engine:
        condition: service_healthy
        required: false
      presentations-engine:
        condition: service_healthy
        required: false
      docs-projects:
        condition: service_healthy
        required: false
      docs-ai:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8170/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  docs-engine:
    profiles: ["docs"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.docs-engine
    environment:
      ERA_DOCS_HTTP_ADDR: ":8142"
      ERA_OFFICE_DEV: "1"
      ERA_DRIVE_API_URL: http://drive-api:8175
      ERA_DRIVE_SERVICE_TOKEN: dev-drive-service-token
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
      ERA_OFFICE_DATABASE_URL: postgres://era:era_dev_only@postgres:5432/era?sslmode=disable
    ports:
      - "8142:8142"
    depends_on:
      drive-api:
        condition: service_healthy
      office-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8142/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  tables-engine:
    profiles: ["office-engines"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.tables-engine
    environment:
      ERA_TABLES_HTTP_ADDR: ":8143"
      ERA_OFFICE_DEV: "1"
      ERA_DRIVE_API_URL: http://drive-api:8175
      ERA_DRIVE_SERVICE_TOKEN: dev-drive-service-token
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
    ports:
      - "8143:8143"
    depends_on:
      drive-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8143/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  presentations-engine:
    profiles: ["office-engines"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.presentations-engine
    environment:
      ERA_PRESENTATIONS_HTTP_ADDR: ":8144"
      ERA_OFFICE_DEV: "1"
      ERA_DRIVE_API_URL: http://drive-api:8175
      ERA_DRIVE_SERVICE_TOKEN: dev-drive-service-token
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
    ports:
      - "8144:8144"
    depends_on:
      drive-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8144/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  docs-projects:
    profiles: ["office-engines"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.docs-projects
    environment:
      ERA_PROJECTS_HTTP_ADDR: ":8145"
      ERA_OFFICE_DEV: "1"
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
      ERA_OFFICE_DATABASE_URL: postgres://era:era_dev_only@postgres:5432/era?sslmode=disable
      ERA_DRIVE_API_URL: http://drive-api:8175
      ERA_DRIVE_SERVICE_TOKEN: dev-drive-service-token
    ports:
      - "8145:8145"
    depends_on:
      office-migrate:
        condition: service_completed_successfully
      drive-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8145/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  docs-ai:
    profiles: ["office-engines"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.docs-ai
    environment:
      ERA_DOCS_AI_HTTP_ADDR: ":8146"
      ERA_OFFICE_DEV: "1"
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
      # Unset = stub summarize/rewrite (air-gap). Optional: ERA_OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "8146:8146"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8146/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional; Dockerfile not in TE critical path (missing historically → blocks bare up).
  admin-portal:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.admin-portal
    environment:
      ERA_HTTP_ADDR: ":8140"
      ERA_OFFICE_DATABASE_URL: postgres://era:era_dev_only@postgres:5432/era?sslmode=disable
    ports:
      - "8140:8140"
    depends_on:
      office-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8140/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui-mail:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.ui-mail
    profiles: ["with-comms"]
    environment:
      ERA_UI_MAIL_ADDR: ":8180"
      ERA_MAIL_API_URL: http://era-mail-api:8150
      ERA_DRIVE_API_URL: http://drive-api:8175
      ERA_IDENTITY_JWT_SECRET: dev-only-change-in-prod
    ports:
      - "8180:8180"
    depends_on:
      drive-api:
        condition: service_healthy

volumes:
  era_postgres_data:
