# ERA Comms HA lab overlay (Summer S3-5)
# Usage: docker compose -f deploy/docker-compose.comms.yml -f deploy/docker-compose.comms.dev.yml -f deploy/docker-compose.comms.ha.yml up -d --wait

services:
  era-mail-api-2:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/Dockerfile.mail-api
    environment:
      ERA_COMMS_DATABASE_URL: postgres://era:era_dev_only@postgres:5432/era?sslmode=disable
      ERA_MAIL_HTTP_ADDR: ":8150"
      ERA_MAIL_DEV: "1"
      ERA_MINIO_ENDPOINT: minio:9000
      ERA_MINIO_BUCKET: era-comms
      ERA_MINIO_ACCESS_KEY: era
      ERA_MINIO_SECRET_KEY: era_dev_only
      ERA_CH_ADDR: clickhouse:9000
      ERA_CH_USER: era
      ERA_CH_PASSWORD: era_dev_only
    depends_on:
      era-mail-api:
        condition: service_healthy
    # Second replica — reach via docker network era-mail-api-2:8150 (LB external in field)
