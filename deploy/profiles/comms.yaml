# ERA Communications — deploy profile (roadmap)
# ADR-0027 | PRD: docs/products/PRD-Comms-MVP.md

schema_version: "1.0"
id: era-comms
product: era-communications
title: ERA Communications
status: implemented

compose:
  file: deploy/docker-compose.comms.yml
  overlays:
    - deploy/docker-compose.comms.dev.yml   # lab DEV=1
    - deploy/docker-compose.comms.prod.yml  # TLS + DEV=0 + license modules
  project_name: era-one-comms
  note: >
    One-shot lab: docker compose -f deploy/docker-compose.comms.yml up -d --wait
    Prod smoke: add -f deploy/docker-compose.comms.prod.yml (Refs: GAP-P0-30, Deepen D1)
  status: implemented

shared_platform:
  required: true
  editions_ref: editions-shared.yaml
  packages:
    - platform/identity
    - platform/tenant
    - platform/adminportal
    - platform/drive
    - platform/workspace
  services:
    - admin-portal
    - postgres
  compose_profiles:
    pg: [postgres]

# ClickHouse audit — обязателен (PRD-Comms-MVP AC-C7)
infra:
  required:
    - clickhouse
    - minio

workspace:
  url: https://app.customer.local
  routes: [/mail, /chat, /conference]

planned_services:
  - id: comms-mail
    description: Rust core + Go API — SMTP/IMAP/EWS subset/Autodiscover
  - id: comms-mail-connect
    description: BFF → external IMAP/JMAP (hybrid tier)
  - id: comms-migration
    description: Bulk migration into ERA Mail Server
  - id: comms-mail-moderation
    description: Outbound SMTP moderation (hold → Approve/Reject)
  - id: comms-calendar
    description: CalDAV full read/write
  - id: comms-chat
    description: Corporate messenger
  - id: comms-vcs
    description: LiveKit on-prem adapter
  - id: comms-ai
    description: ERA Comms AI

editions_ref: editions-comms.yaml
pricing_model: per-user
pricing_ref: docs/distributor/pricing-comms-data.yaml
service_stub: services/comms

docs:
  - docs/products/ERA-Communications-Vision.md
  - docs/products/PRD-Comms-MVP.md
  - docs/adr/0027-era-communications-architecture.md
