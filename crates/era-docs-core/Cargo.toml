[package]
name = "era-docs-core"
version = "0.1.0"
edition = "2021"
description = "ERA Documents pure core — model, convert, OpLog (S2/B0; ADR-0026)"
publish = false

[lib]
name = "era_docs_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
prost = "0.13"
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
prost-build = "0.13"
