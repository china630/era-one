[package]
name = "era-projects-core"
version = "0.1.0"
edition = "2021"
description = "ERA Projects pure core — .eraj board+tasks JSON (C1; ADR-0026)"
publish = false

[lib]
name = "era_projects_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
