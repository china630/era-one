<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERA XDR — Workbench</title>
  <style>
    :root { --bg: #0f1419; --card: #1a2332; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --det: #f85149; --evt: #3fb950; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    nav a { color: var(--accent); margin-right: 1rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    input, button, select { background: var(--card); border: 1px solid #30363d; color: var(--text); padding: 0.5rem; border-radius: 6px; }
    button { cursor: pointer; background: #238636; border-color: #238636; }
    #status { color: var(--muted); margin-bottom: 0.5rem; }
    .layout { display: grid; grid-template-columns: 1fr 280px; gap: 1rem; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .timeline { background: var(--card); border-radius: 8px; padding: 0.5rem 1rem; }
    .entry { border-left: 3px solid var(--evt); padding: 0.6rem 0.8rem; margin: 0.5rem 0; background: #161b22; border-radius: 4px; }
    .entry.detection { border-left-color: var(--det); }
    .entry .meta { font-size: 0.75rem; color: var(--muted); }
    .entry .summary { margin-top: 0.25rem; }
    .exposure { background: var(--card); border-radius: 8px; padding: 0.75rem; font-size: 0.875rem; }
    .exposure h2 { font-size: 0.95rem; margin: 0 0 0.5rem; }
    .exposure ol { margin: 0; padding-left: 1.2rem; }
    .exposure li { margin: 0.35rem 0; }
    .score { color: #ffa657; font-weight: 600; }
    .filter { min-width: 120px; }
  </style>
</head>
<body>
  <nav>
    <a href="/ui/cases/">Cases</a>
    <a href="/ui/workbench/">Workbench</a>
    <a href="/ui/assets/">Assets</a>
    <a href="/api/proxy/events">Events API</a>
  </nav>
  <h1>ERA Workbench — Incident Timeline</h1>
  <div id="status">Загрузка…</div>
  <div class="toolbar">
    <input id="caseId" placeholder="case_id" />
    <input id="nodeId" placeholder="node_id" />
    <input id="corrId" placeholder="correlation_id" />
    <select id="sourceFilter" class="filter">
      <option value="">Все источники</option>
      <option value="agent">agent</option>
      <option value="sigma">sigma</option>
      <option value="byo-edr">byo-edr</option>
    </select>
    <button id="load">Загрузить timeline</button>
  </div>
  <div class="layout">
    <div class="timeline" id="timeline"></div>
    <aside class="exposure">
      <h2>Exposure — Top 10</h2>
      <ol id="top10"></ol>
      <h2 style="margin-top:1rem">MITRE coverage</h2>
      <div id="mitre" style="max-height:240px;overflow:auto;font-size:0.75rem"></div>
      <h2 style="margin-top:1rem">Attack graph</h2>
      <div id="graph" style="font-size:0.75rem;max-height:200px;overflow:auto"></div>
      <h2 style="margin-top:1rem">AI recommendations</h2>
      <p style="color:var(--muted);font-size:0.75rem">Human-on-loop — ИИ не закрывает инцидент автономно</p>
      <button id="runInv" style="margin-bottom:0.5rem;width:100%">Investigate</button>
      <div id="recs" style="font-size:0.75rem;max-height:280px;overflow:auto"></div>
    </aside>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    let lastInvestigation = null;
    if (params.get('case_id')) document.getElementById('caseId').value = params.get('case_id');
    if (params.get('node_id')) document.getElementById('nodeId').value = params.get('node_id');

    async function loadTimeline() {
      const q = new URLSearchParams();
      const caseId = document.getElementById('caseId').value.trim();
      const nodeId = document.getElementById('nodeId').value.trim();
      const corrId = document.getElementById('corrId').value.trim();
      if (caseId) q.set('case_id', caseId);
      if (nodeId) q.set('node_id', nodeId);
      if (corrId) q.set('correlation_id', corrId);
      const src = document.getElementById('sourceFilter').value;
      const res = await fetch('/api/v1/workbench/timeline?' + q.toString());
      if (!res.ok) {
        document.getElementById('status').textContent = 'Ошибка: ' + res.status;
        return;
      }
      const data = await res.json();
      let items = data.timeline || [];
      if (src) items = items.filter(e => (e.source || '').includes(src) || (src === 'byo-edr' && (e.payload || '').includes('byo-edr')));
      const el = document.getElementById('timeline');
      el.innerHTML = '';
      for (const e of items) {
        const div = document.createElement('div');
        div.className = 'entry' + (e.kind === 'detection' ? ' detection' : '');
        div.innerHTML = `
          <div class="meta">${e.at} · ${e.kind} · ${e.severity} · ${e.source || '—'} · ${e.node_id || ''}</div>
          <div class="summary">${e.summary || e.category || '—'}</div>`;
        el.appendChild(div);
      }
      document.getElementById('status').textContent = `Timeline: ${items.length} записей`;
      renderGraph(items);
    }

    function renderGraph(items) {
      const el = document.getElementById('graph');
      if (!el) return;
      const steps = (items || []).map(e => ({
        event_id: e.event_id || e.id || '',
        category: e.category || e.kind || 'other',
        observed_at: e.at || '',
        summary: e.summary || ''
      }));
      fetch('http://127.0.0.1:8091/api/v1/investigate/graph', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ storyline: steps })
      }).then(r => r.ok ? r.json() : null).then(g => {
        if (!g) { el.textContent = 'graph API offline'; return; }
        el.innerHTML = (g.edges||[]).map(e => `<div>${String(e.from).slice(0,8)}… → ${String(e.to).slice(0,8)}… <span style="color:var(--muted)">${e.rel}</span></div>`).join('')
          || (g.nodes||[]).map(n => `<div>${n.kind}: ${n.label||n.id}</div>`).join('')
          || 'no edges';
      }).catch(() => { el.textContent = 'graph unavailable'; });
    }

    async function loadExposure() {
      const res = await fetch('/api/v1/exposure?top=10');
      if (!res.ok) return;
      const data = await res.json();
      const ol = document.getElementById('top10');
      ol.innerHTML = '';
      for (const a of (data.top || [])) {
        const li = document.createElement('li');
        li.innerHTML = `<span class="score">${a.score.toFixed(1)}</span> ${a.hostname || a.node_id}`;
        li.style.cursor = 'pointer';
        li.onclick = () => {
          document.getElementById('nodeId').value = a.node_id;
          loadTimeline();
        };
        ol.appendChild(li);
      }
    }

    async function loadMitre() {
      const res = await fetch('/api/proxy/detection/api/v1/mitre/coverage').catch(() => null);
      const alt = res && res.ok ? res : await fetch('http://127.0.0.1:8097/api/v1/mitre/coverage').catch(() => null);
      if (!alt || !alt.ok) {
        document.getElementById('mitre').textContent = 'coverage unavailable';
        return;
      }
      const data = await alt.json();
      const el = document.getElementById('mitre');
      el.innerHTML = '<table style="width:100%"><tr><th>T</th><th>rules</th><th>seen</th></tr>' +
        (data.techniques || []).slice(0, 40).map(t =>
          `<tr><td>${t.technique}</td><td>${t.rule_count||0}</td><td>${t.seen_count||0}</td></tr>`
        ).join('') + '</table>';
    }

    document.getElementById('load').onclick = loadTimeline;
    document.getElementById('runInv').onclick = runInvestigate;
    loadExposure();
    loadMitre();
    if (params.get('case_id') || params.get('node_id')) loadTimeline();

    async function runInvestigate() {
      const nodeId = document.getElementById('nodeId').value.trim() || 'node-lab';
      const el = document.getElementById('recs');
      el.textContent = '…';
      try {
        const r = await fetch('http://127.0.0.1:8091/api/v1/investigate', {
          method: 'POST', headers: {'Content-Type':'application/json','X-ERA-Actor':'workbench'},
          body: JSON.stringify({ node_id: nodeId, detection_id: document.getElementById('caseId').value.trim() || 'wb' })
        });
        const data = await r.json();
        if (!r.ok) { el.textContent = JSON.stringify(data); return; }
        lastInvestigation = data;
        renderRecs(data);
      } catch (e) {
        el.textContent = 'ai-core offline: ' + e;
      }
    }

    function renderRecs(data) {
      const el = document.getElementById('recs');
      const acts = data.recommended_actions || [];
      el.innerHTML = `<div class="meta">verdict=${data.verdict} id=${data.investigation_id||''}</div>` +
        acts.map(a => `<div class="entry" style="border-left-color:var(--accent)">
          <div>${a.title} <span class="meta">[${a.status||'pending'}]</span></div>
          <div class="meta">${a.kind} · ${a.detail||''}</div>
          <button data-act="${a.id}" data-dec="confirm" class="btn-acc">Accept</button>
          <button data-act="${a.id}" data-dec="reject" class="btn-rej" style="background:#da3633;border-color:#da3633">Reject</button>
        </div>`).join('') || 'no recommendations';
      el.querySelectorAll('button[data-act]').forEach(btn => {
        btn.onclick = () => decide(btn.dataset.act, btn.dataset.dec);
      });
    }

    async function decide(actionId, decision) {
      if (!lastInvestigation || !lastInvestigation.investigation_id) return;
      const id = lastInvestigation.investigation_id;
      const r = await fetch(`http://127.0.0.1:8091/api/v1/investigate/${id}/${decision}`, {
        method: 'POST', headers: {'Content-Type':'application/json','X-ERA-Actor':'workbench'},
        body: JSON.stringify({ action_id: actionId })
      });
      const data = await r.json();
      document.getElementById('status').textContent = decision + ': ' + JSON.stringify(data.decision || data);
      if (lastInvestigation.recommended_actions) {
        const a = lastInvestigation.recommended_actions.find(x => x.id === actionId);
        if (a) a.status = decision === 'confirm' ? 'accepted' : 'rejected';
        renderRecs(lastInvestigation);
      }
    }
  </script>
</body>
</html>
