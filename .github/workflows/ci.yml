# Монорепо CI: PR → dev, push dev, PR dev → main.
# Production merge в main только после зелёных чеков на PR.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-consistency:
    name: acceptance (consistency v1.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acceptance consistency gate
        shell: pwsh
        run: ./scripts/check-acceptance-consistency.ps1

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binary install (no gitleaks-action org license required for private repos).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  lint:
    name: lint (go scoped + rust clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: golangci-lint (AuthZ / license / ingest hotspots)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          args: >-
            ./services/platform/licensegate/...
            ./services/platform/httpserver/...
            ./services/comms/internal/httpauth/...
            ./services/ingest-gateway/internal/server/...
            ./services/ingest-gateway/internal/pipeline/...

      - name: cargo clippy (era-agent-core)
        run: cargo clippy -p era-agent-core --all-targets -- -A warnings

  vuln:
    name: vuln (govulncheck + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install govulncheck + cargo-deny
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cargo install cargo-deny --locked || cargo install cargo-deny

      - name: govulncheck (scoped)
        run: |
          govulncheck ./services/platform/licensegate/...
          govulncheck ./services/comms/internal/httpauth/...
          govulncheck ./services/ingest-gateway/internal/server/...

      - name: cargo deny advisories
        run: cargo deny check advisories

  e2e-office-smoke:
    name: e2e (office playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/office/e2e/package-lock.json

      - name: Install Playwright
        working-directory: ui/office/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Office docs-smoke (Playwright)
        working-directory: ui/office/e2e
        run: npx playwright test docs-smoke.spec.ts
        env:
          CI: "1"

  site:
    name: site (build + golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build site artifact
        run: bash scripts/build-site.sh

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/site/
          retention-days: 14

  go-test:
    name: go (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: go test (platform + ingest)
        run: |
          go test ./services/platform/licensegate/...
          go test ./services/platform/httpserver/...
          go test ./services/ingest-gateway/internal/server/...
          go test ./services/ingest-gateway/internal/pipeline/...

  rust-agent:
    name: rust (agent PII + budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: PII golden + budget guard
        run: |
          cd crates/era-agent
          cargo test golden_pii
          cd ../era-agent-core
          cargo test budget_guard::

  compose-config:
    name: deploy (compose validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate prod compose
        run: docker compose -f deploy/docker-compose.prod.yml config --quiet

  stage10:
    name: stage10 gates (full)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: era
          POSTGRES_PASSWORD: era_ci_pw
          POSTGRES_DB: era_cp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U era"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ERA_STORE_PG_DSN: postgres://era:era_ci_pw@localhost:5432/era_cp?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: stage10 — go gates
        run: bash scripts/ci-gates-stage10.sh go

      - name: stage10 — rust PII golden
        run: (cd crates/era-agent && cargo test golden_pii)

      - name: stage10 — rust budget + tamper
        run: |
          cd crates/era-agent-core
          cargo test budget_guard::
          cargo test tamper:: -- --test-threads=1

      - name: stage10 — rust plugin-vuln
        run: (cd crates/era-plugin-vuln && cargo test)
