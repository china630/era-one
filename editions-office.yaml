# ERA Office — манифест изданий
#
# ADR-0024, ADR-0026. Drive — editions-shared.yaml (включён в office-suite).
# Pricing: docs/distributor/pricing-office-data.yaml

schema_version: "1.0"
product: era-office

editions:
  era-documents:
    title: ERA Documents
    # Honesty 2026-07-30: O-0…O-5 gates PASS; O-GA honesty closeout; field RT-O09 open → not ga
    status: mvp
    license_module: { name: office-documents, exists: true }
    description: Текстовые документы, co-editing (.erad + docx I/O).
    services: [platform-docs-engine, docs-engine]
    requires_shared: [era-drive]
    pricing_ref: office-documents
    proof: "O-GA gate — scripts/run-office-stage-gate.ps1 -Stage O-GA"

  era-tables:
    title: ERA Tables
    # Honesty 2026-07-30: O-T scaffold/mvp gates; field Pilot-ready open → not ga
    status: mvp
    license_module: { name: office-tables, exists: true }
    description: Таблицы, формулы (.erat + xlsx I/O).
    services: [platform-tables-engine, tables-engine]
    requires_shared: [era-drive]
    pricing_ref: office-tables
    proof: "O-T-TE gate — scripts/run-office-stage-gate.ps1 -Stage O-T-TE"

  era-presentations:
    title: ERA Presentations
    status: mvp
    license_module: { name: office-presentations, exists: true }
    description: Презентации on-prem (.erap).
    services: [platform-presentations-engine, presentations-engine]
    requires_shared: [era-drive]
    pricing_ref: office-presentations
    proof: "O-P-4 gate"

  era-projects:
    title: ERA Projects
    status: mvp
    license_module: { name: office-projects, exists: true }
    description: Управление проектами (kanban scaffold).
    services: [docs-projects]
    requires_shared: [era-drive]
    pricing_ref: office-projects
    proof: "O-PR-3 gate"

  era-office-ai:
    title: ERA Office AI
    status: mvp
    license_module: { name: office-ai, exists: true }
    description: Air-Gap LLM для документов. ≠ Control/Comms AI.
    services: [platform-docs-ai]
    requires_shared: [era-drive]
    pricing_ref: office-ai
    proof: "O-AI-3 gate"
bundles:
  office-mvp:
    title: ERA Office MVP
    description: Drive + Documents (pilot).
    shared_editions: [era-drive]
    editions: [era-documents]
    pricing_ref: office-mvp

  office-suite:
    title: ERA Office Suite
    description: Drive всегда включён.
    shared_editions: [era-drive]
    editions: [era-documents, era-tables, era-presentations, era-projects]
    pricing_ref: office-suite

shared_editions_ref: editions-shared.yaml
pricing_ref: docs/distributor/pricing-office-data.yaml
