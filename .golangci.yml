# Scoped lint for CI (ADR-0014 depguard — enable gradually).
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 5

linters-settings:
  staticcheck:
    checks: ["all", "-ST1000", "-ST1003"]
